name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    name: Repository foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            README-ko.md
            LICENSE
            CONTRIBUTING.md
            CONTRIBUTING-ko.md
            SECURITY.md
            SECURITY-ko.md
            CODE_OF_CONDUCT.md
            CODE_OF_CONDUCT-ko.md
            .gitignore
            .editorconfig
            docs/architecture.md
            docs/architecture-ko.md
            docs/development.md
            docs/development-ko.md
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Validate bilingual documentation filenames
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f README-ko.md
          for file in $(find . -type f -name '*.md' \
            ! -path './.git/*' \
            ! -path './node_modules/*' \
            ! -path './.github/*' \
            ! -name '*-ko.md' \
            ! -name 'LICENSE.md'); do
            ko="${file%.md}-ko.md"
            if [[ "$file" != ./README.md && "$file" != README.md && ! -f "$ko" ]]; then
              echo "Missing Korean document: $ko (for $file)"
              exit 1
            fi
          done

      - name: Validate language switcher
        shell: bash
        run: |
          set -euo pipefail
          head -n 2 README.md | grep -q 'English |.*README-ko.md'
          head -n 2 README-ko.md | grep -q 'English |.*README-ko.md'

      - name: Validate workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for path in Path('.github/workflows').glob('*.yml'):
              text = path.read_text(encoding='utf-8')
              if not text.strip():
                  raise SystemExit(f'Empty workflow: {path}')
              if 'name:' not in text or 'jobs:' not in text:
                  raise SystemExit(f'Invalid workflow structure: {path}')
          print('Workflow foundation validation passed.')
          PY

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check markdown links to local files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f README-ko.md
          test -f docs/architecture.md
          test -f docs/architecture-ko.md
          test -f docs/development.md
          test -f docs/development-ko.md

  test:
    name: Typecheck and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --output-file sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
