name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    name: Repository foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            LICENSE
            CONTRIBUTING.md
            SECURITY.md
            .gitignore
            .editorconfig
            docs/architecture.md
            docs/development.md
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Validate bilingual documentation sections
        shell: bash
        run: |
          set -euo pipefail
          grep -q "## 한국어" README.md
          grep -q "## 한국어" CONTRIBUTING.md
          grep -q "## 한국어" SECURITY.md
          grep -q "## 한국어" docs/architecture.md
          grep -q "## 한국어" docs/development.md

      - name: Validate workflow syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for path in Path('.github/workflows').glob('*.yml'):
              text = path.read_text(encoding='utf-8')
              if not text.strip():
                  raise SystemExit(f'Empty workflow: {path}')
              if 'name:' not in text or 'jobs:' not in text:
                  raise SystemExit(f'Invalid workflow structure: {path}')
          print('Workflow foundation validation passed.')
          PY

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check markdown links to local files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/architecture.md
          test -f docs/development.md
