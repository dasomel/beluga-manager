name: Cleanup merged branch

on:
  pull_request:
    types: [closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  delete-merged-head:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Delete merged head ref
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        shell: bash
        run: |
          set -euo pipefail
          encoded_ref="$(python3 - <<'PY'
          import os
          import urllib.parse
          print(urllib.parse.quote(os.environ['HEAD_REF'], safe=''))
          PY
          )"
          body="$(mktemp)"
          status="$(curl --silent --show-error --output "${body}" --write-out '%{http_code}' \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPOSITORY}/git/refs/heads/${encoded_ref}")"
          # The head ref may already be gone (gh pr merge --delete-branch, Dependabot
          # auto-delete); treat that as done so the job stays idempotent.
          if [ "${status}" = "204" ]; then
            echo "Deleted ${HEAD_REF}"
          elif { [ "${status}" = "404" ] || [ "${status}" = "422" ]; } && grep -q 'Reference does not exist' "${body}"; then
            echo "::notice::${HEAD_REF} was already deleted"
          else
            echo "::error::Deleting ${HEAD_REF} failed with HTTP ${status}"
            cat "${body}"
            exit 1
          fi
