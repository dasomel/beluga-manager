server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # App.tsx currently switches views via useState (no client-side router / no other
    # path is ever requested), so nothing today depends on this fallback. Kept anyway as
    # the standard one-line SPA idiom so a hard refresh on a deep link won't 404 once real
    # routing lands, rather than being a special case to remember to add later.
    location / {
        try_files $uri /index.html;
    }
}
