# Local development stack: Domain API (stub adapters) + web console.
# Works with `docker compose` and `podman compose` (no engine-specific extensions).
#   make dev-up      # build + start, wait for healthchecks
#   make dev-down    # stop and remove
# Fixture data only: no Beluga platform, credentials, or secrets are involved.
name: beluga-manager-dev

services:
  domain-api:
    build:
      context: .
      dockerfile: packages/domain-api/Dockerfile
    image: beluga-manager-domain-api:dev
    # createApp() wires the stub adapter registry; there is no real-upstream mode yet.
    environment:
      PORT: "8787"
    ports:
      # Published on loopback only. Host port 8787 must match web's public/config.json.
      - "127.0.0.1:8787:8787"
    user: "node"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    image: beluga-manager-web:dev
    depends_on:
      domain-api:
        condition: service_healthy
    ports:
      # Host port 5180 is the only origin the Domain API's CORS config allows.
      - "127.0.0.1:5180:80"
    # nginx runs unprivileged (uid 101); it only needs writable cache/pid dirs.
    user: "101:101"
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /run:uid=101,gid=101
      - /tmp:uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
