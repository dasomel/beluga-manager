roles:
  - name: analysts
  - name: engineers
    includes: [analysts]
groups: []
resources:
  - resource: lake.events_enriched
    classification: internal
    grants:
      - roles: [analysts]
        privileges: [select]
  - resource: lake.customers
    classification: pii
    sensitiveColumns: [email]
    grants:
      - roles: [engineers]
        privileges: [select, insert]
        allowUnmasked: true
      - roles: [analysts]
        privileges: [select]
        columnMask:
          email: hash
        rowFilter: "region = 'KR'"
